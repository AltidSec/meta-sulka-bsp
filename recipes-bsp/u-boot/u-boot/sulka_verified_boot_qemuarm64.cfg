# Load the FIT image from the first partition of the virtio disk. The FIT
# image is loaded above the kernel load address, so that the kernel can be
# placed at its load address without overlapping the FIT image.
CONFIG_BOOTCOMMAND="virtio scan; load virtio 0:1 0x50000000 fitImage; bootm 0x50000000"
# The kernel command line runqemu passes on qemuarm64 with slirp networking,
# except that the root file system is on the second partition of the disk
# image and mounted read-only only when it is read-only.
CONFIG_BOOTARGS="root=/dev/vda2 @@SULKA_UBOOT_ROOT_MODE@@ ip=dhcp console=ttyAMA0 swiotlb=0"
CONFIG_SYS_BOOTM_LEN=0x8000000
