# Boot only FIT images whose configuration is signed with a key in the
# U-Boot control device tree. The machine configuration provides the boot
# command that loads the FIT image and the kernel command line.
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y

# Legacy uImages cannot be signed
# CONFIG_LEGACY_IMAGE_FORMAT is not set

# Do not scan the disks for something to boot. Standard boot runs
# extlinux.conf files, boot scripts and EFI binaries from writable
# partitions without verifying them. Its defaults also select booti and
# bootz, which boot unsigned kernel images.
# CONFIG_BOOTSTD is not set
# CONFIG_BOOTSTD_DEFAULTS is not set
# CONFIG_DISTRO_DEFAULTS is not set
# CONFIG_CMD_BOOTI is not set
# CONFIG_CMD_BOOTZ is not set
# CONFIG_CMD_BOOTEFI is not set
# CONFIG_EFI_LOADER is not set
# CONFIG_USE_PREBOOT is not set
CONFIG_USE_BOOTCOMMAND=y
CONFIG_USE_BOOTARGS=y

# The public key is in the control device tree, so it must be the one
# built into U-Boot, not one passed by an earlier boot stage
CONFIG_OF_SEPARATE=y
# CONFIG_OF_BOARD is not set
# CONFIG_OF_OMIT_DTB is not set
