CONFIG_BOOTDELAY=1
CONFIG_AUTOBOOT_KEYED=y
CONFIG_AUTOBOOT_STOP_STR_ENABLE=y
CONFIG_AUTOBOOT_NEVER_TIMEOUT=y
CONFIG_AUTOBOOT_ENCRYPTION=y
CONFIG_CRYPT_PW=y
CONFIG_CRYPT_PW_SHA512=y
CONFIG_AUTOBOOT_STOP_STR_CRYPT="@@SULKA_UBOOT_PASSWORD@@"

CONFIG_UNLOCKING=y

# Disable external environments. Enable these as required, but avoid
# storing boot flow critical information to the external, writable
# environments and move what you can to the built-in environment.
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_ENV_IS_IN_EEPROM is not set
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_IN_EXT4 is not set
# CONFIG_ENV_IS_IN_FLASH is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_NVRAM is not set
# CONFIG_ENV_IS_IN_ONENAND is not set
# CONFIG_ENV_IS_IN_REMOTE is not set
