# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sulka-bsp"
BBFILE_PATTERN_meta-sulka-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sulka-bsp = "10"

LAYERSERIES_COMPAT_meta-sulka-bsp = "scarthgap"
